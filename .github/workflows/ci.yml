name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run to catch breakage from new upstream releases and advisories between commits.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PR branches. Runs on master always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  includes_only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.6
          - php-versions: '5.6'
            phpunit-versions: '^5'
            symfony-versions: '^2'
          - php-versions: '5.6'
            phpunit-versions: '^5'
            symfony-versions: '^3'
          # 7.1
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^2'
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^3'
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^4'
          # 7.2
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^2'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^3'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^4'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^5'
          # 7.3
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^2'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          # 7.4
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^2'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          # 8.0
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^6'
          # 8.1
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^3'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^4'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^5'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^6'
          # 8.2
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^3'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^4'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^5'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^6'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^7'
          # 8.3
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          # 8.4
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^8'
          # 8.5
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^8'
          # 8.6 (setup-php installs a nightly build until 8.6 is released)
          - php-versions: '8.6'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.6'
            phpunit-versions: '^12'
            symfony-versions: '^8'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2, phpunit:${{ matrix.phpunit-versions }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove composer.lock and dev dependencies
        run: |
          rm composer.lock
          composer remove --dev --no-update phpstan/phpstan phpunit/phpunit symplify/easy-coding-standard captainhook/captainhook ramsey/conventional-commits
      - name: Require matrix symfony/yaml
        run: composer require --no-update symfony/yaml:${{ matrix.symfony-versions }}
      # Matrix jobs install old symfony/yaml versions on purpose, to test compatibility.
      # New advisories keep appearing for them, so turn off advisory blocking rather than
      # ignoring advisory IDs one at a time. Composer 2.2 (PHP 5.6/7.1) has no advisory
      # blocking and rejects the key, hence `|| true`.
      - name: Allow legacy symfony/yaml versions with known advisories
        run: composer config --global --json policy.advisories.block false || true
      - run: composer update --ignore-platform-reqs
      - name: Test with phpunit
        run: phpunit

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Check dependencies for security advisories
        run: composer audit
      - name: Code style (ECS)
        run: composer code-style
      - name: Static analysis (PHPStan)
        run: composer code-analyse
      - name: Markdown lint
        run: composer markdown-lint
      - name: YAML lint (using yaml-lint itself)
        run: php bin/yaml-lint .github/dependabot.yml .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml
      # Checks that the distribution archive (what Composer dist installs get) has
      # everything it needs to run, given the allowlist in .gitattributes.
      - name: Distribution archive smoke test
        run: |
          mkdir "$RUNNER_TEMP/dist"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/dist"
          {
            echo '## Distribution archive'
            echo
            git archive HEAD | tar -t | grep -v '/$' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/dist"
          composer install --no-dev --no-interaction --no-progress
          php bin/yaml-lint --version
          php bin/yaml-lint "$GITHUB_WORKSPACE/tests/fixtures/valid.yml"
          if php bin/yaml-lint "$GITHUB_WORKSPACE/tests/fixtures/invalid.yml"; then
            echo 'Expected invalid.yml to fail linting' >&2
            exit 1
          fi
      # The tests run the CLI in subprocesses, so coverage is collected in each one by
      # loading tests/coverage/prepend.php through an extra ini file.
      - name: Tests with coverage
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-ini" "$RUNNER_TEMP/coverage"
          printf 'pcov.enabled=1\nauto_prepend_file=%s\n' "$PWD/tests/coverage/prepend.php" > "$RUNNER_TEMP/coverage-ini/coverage.ini"
          export PHP_INI_SCAN_DIR="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;'):$RUNNER_TEMP/coverage-ini"
          export YAML_LINT_COVERAGE_DIR="$RUNNER_TEMP/coverage"
          vendor/bin/phpunit
      - name: Coverage report
        run: |
          php tests/coverage/report.php "$RUNNER_TEMP/coverage" "$RUNNER_TEMP/coverage.md" coverage.json
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage.json

  # Builds the production image (published by docker.yml on release tags) and checks
  # that it runs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag yaml-lint:ci .
      - name: Image smoke test
        run: |
          docker run --rm yaml-lint:ci --version
          docker run --rm -v "$PWD/tests/fixtures:/workdir:ro" yaml-lint:ci valid.yml
          docker run --rm -i yaml-lint:ci - < tests/fixtures/valid.yml
          if docker run --rm -v "$PWD/tests/fixtures:/workdir:ro" yaml-lint:ci invalid.yml; then
            echo 'Expected invalid.yml to fail linting' >&2
            exit 1
          fi

  # A single, stable check for branch rules to require, instead of every matrix job.
  # It runs even if a job it depends on fails, and passes only if none failed or was
  # cancelled.
  ci-passed:
    needs: [includes_only, quality, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs passed
        run: |
          echo "Job results: ${{ join(needs.*.result, ', ') }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]

  # Publishes the coverage badge data to the badges branch, read by the README badge
  # through shields.io. Only runs for pushes to master.
  coverage-badge:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage badge data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
      - name: Commit to the badges branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if ! git clone --quiet --depth 1 --branch badges "$REPO_URL" badges; then
            git init --quiet -b badges badges
            git -C badges remote add origin "$REPO_URL"
          fi
          cp coverage.json badges/coverage.json
          cd badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.json
          if git diff --cached --quiet; then
            echo 'Coverage unchanged'
          else
            git commit --quiet -m 'chore: update coverage badge'
            git push --quiet origin badges
          fi
