name: CI

on: push

permissions:
  contents: read

jobs:
  includes_only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.6
          - php-versions: '5.6'
            phpunit-versions: '^5'
            symfony-versions: '^2'
          - php-versions: '5.6'
            phpunit-versions: '^5'
            symfony-versions: '^3'
          # 7.1
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^2'
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^3'
          - php-versions: '7.1'
            phpunit-versions: '^7'
            symfony-versions: '^4'
          # 7.2
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^2'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^3'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^4'
          - php-versions: '7.2'
            phpunit-versions: '^8'
            symfony-versions: '^5'
          # 7.3
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^2'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '7.3'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          # 7.4
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^2'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '7.4'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          # 8.0
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^3'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^4'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^5'
          - php-versions: '8.0'
            phpunit-versions: '^9'
            symfony-versions: '^6'
          # 8.1
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^3'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^4'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^5'
          - php-versions: '8.1'
            phpunit-versions: '^10'
            symfony-versions: '^6'
          # 8.2
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^3'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^4'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^5'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^6'
          - php-versions: '8.2'
            phpunit-versions: '^11'
            symfony-versions: '^7'
          # 8.3
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.3'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          # 8.4
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.4'
            phpunit-versions: '^12'
            symfony-versions: '^8'
          # 8.5
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^3'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^4'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^5'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^6'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.5'
            phpunit-versions: '^12'
            symfony-versions: '^8'
          # 8.6 (setup-php installs a nightly build until 8.6 is released)
          - php-versions: '8.6'
            phpunit-versions: '^12'
            symfony-versions: '^7'
          - php-versions: '8.6'
            phpunit-versions: '^12'
            symfony-versions: '^8'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2, phpunit:${{ matrix.phpunit-versions }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Remove composer.lock and dev dependencies
        run: |
          rm composer.lock
          composer remove --dev --no-update phpstan/phpstan phpunit/phpunit symplify/easy-coding-standard captainhook/captainhook ramsey/conventional-commits
      - name: Require matrix symfony/yaml
        run: composer require --no-update symfony/yaml:${{ matrix.symfony-versions }}
      # Matrix jobs install old symfony/yaml versions on purpose, to test compatibility.
      # New advisories keep appearing for them, so turn off advisory blocking rather than
      # ignoring advisory IDs one at a time. Composer 2.2 (PHP 5.6/7.1) has no advisory
      # blocking and rejects the key, hence `|| true`.
      - name: Allow legacy symfony/yaml versions with known advisories
        run: composer config --global --json policy.advisories.block false || true
      - run: composer update --ignore-platform-reqs
      - name: Test with phpunit
        run: phpunit
