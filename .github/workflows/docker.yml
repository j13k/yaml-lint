name: Docker

# Publishes the production image and its overview to Docker Hub when a release is tagged, and
# rebuilds the newest release's image monthly to pick up security fixes in the PHP base image
# and Alpine packages. Run it by hand to rebuild a particular release's image.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example 1.1.9)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  IMAGE: j13k/yaml-lint

jobs:
  publish:
    runs-on: ubuntu-latest
    # Holds the Docker Hub secrets, and only master and release tags can use it.
    environment: docker-hub
    steps:
      # Builds the pushed or requested tag, or for the monthly rebuild, the newest release.
      # Moves the latest, major and minor tags only if this is the newest release they
      # cover, so a 1.1.x release after 1.2.0 doesn't take `latest` or `1` back to 1.1.
      - name: Work out the version and which image tags to move
        id: newest
        env:
          REQUESTED: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          releases=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          newest() { echo "$releases" | grep -E "^$1" | sort -V | tail -n 1; }
          VERSION=${REQUESTED:-$(newest '')}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          major=${VERSION%%.*}
          minor=${VERSION%.*}
          echo "latest=$([ "$(newest '')" = "$VERSION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "major=$([ "$(newest "$major\.")" = "$VERSION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "minor=$([ "$(newest "${minor//./\\.}\.")" = "$VERSION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          cat "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
          persist-credentials: false

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ steps.newest.outputs.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ steps.newest.outputs.minor }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ steps.newest.outputs.major }}

      # The final stage runs `apk upgrade`, so the arm64 build needs emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check the published image
        run: |
          docker run --rm "$IMAGE:$VERSION" --version | tee version.txt
          grep -q "^yaml-lint $VERSION," version.txt

      # Only the newest release updates the overview, so rebuilding an older one doesn't take
      # it back. Releases from before the template was added skip it.
      - name: Fill in the Docker Hub overview
        if: steps.newest.outputs.latest == 'true' && hashFiles('.github/dockerhub-overview.md') != ''
        run: |
          php_version=$(docker run --rm --entrypoint php "$IMAGE:$VERSION" -r 'echo PHP_VERSION;')
          yaml_version=$(sed -n 's|.*symfony/yaml v||p' version.txt)
          sed -e '/^<!--.*-->$/d' \
            -e "s/{{VERSION}}/$VERSION/g" \
            -e "s/{{MINOR}}/${VERSION%.*}/g" \
            -e "s/{{MAJOR}}/${VERSION%%.*}/g" \
            -e "s/{{PHP_VERSION}}/$php_version/g" \
            -e "s/{{SYMFONY_YAML_VERSION}}/$yaml_version/g" \
            .github/dockerhub-overview.md > "$RUNNER_TEMP/dockerhub-overview.md"
          cat "$RUNNER_TEMP/dockerhub-overview.md"
          if grep -q '{{' "$RUNNER_TEMP/dockerhub-overview.md"; then
            echo 'The overview has values that were not filled in' >&2
            exit 1
          fi

      - name: Publish the Docker Hub overview
        if: steps.newest.outputs.latest == 'true' && hashFiles('.github/dockerhub-overview.md') != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ${{ runner.temp }}/dockerhub-overview.md
